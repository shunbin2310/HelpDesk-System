name: HelpDesk CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend tests and migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      sqlserver:
        # SQL Server 2022, verified locally. Credentials are disposable CI values.
        image: mcr.microsoft.com/mssql/server@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: HelpDeskCiOnly!2026
          MSSQL_MEMORY_LIMIT_MB: 2048
        ports:
          - 127.0.0.1:1433:1433
        options: >-
          --memory 3g
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'HelpDeskCiOnly!2026' -C -b -l 5 -Q 'SELECT 1' -o /dev/null"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 18
          --health-start-period 30s
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_ENVIRONMENT: CI
      ASPNETCORE_ENVIRONMENT: CI
      HELPDESK_TEST_CONNECTION: Server=tcp:127.0.0.1,1433;Database=HelpDeskCi;User Id=sa;Password=HelpDeskCiOnly!2026;Encrypt=True;TrustServerCertificate=True
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies and EF CLI
        run: |
          dotnet restore HelpDesk.slnx
          dotnet tool restore

      - name: Test deployment failure and permission handling offline
        run: sudo /usr/bin/python3 -m unittest discover -s scripts/deploy/tests -v

      - name: Build backend
        run: dotnet build HelpDesk.slnx --configuration Release --no-restore

      - name: Check model has a migration
        env:
          # Design-time Factory only; this unreachable address must not be contacted.
          ConnectionStrings__DefaultConnection: Server=tcp:127.0.0.1,1;Database=HelpDeskCiModelCheck;User Id=unused;Password=unused;Connect Timeout=1
        run: >-
          dotnet tool run dotnet-ef -- migrations has-pending-model-changes
          --project src/HelpDesk.Infrastructure --startup-project src/HelpDesk.Api
          --context HelpDeskDbContext --configuration Release --no-build

      - name: Initialize disposable CI database
        env:
          ConnectionStrings__DefaultConnection: ${{ env.HELPDESK_TEST_CONNECTION }}
        run: >-
          dotnet tool run dotnet-ef -- database update
          --project src/HelpDesk.Infrastructure --startup-project src/HelpDesk.Api
          --context HelpDeskDbContext --configuration Release --no-build

      - name: Run unit tests
        run: >-
          dotnet test tests/HelpDesk.UnitTests --configuration Release --no-build --no-restore
          --logger "trx;LogFileName=unit.trx" --results-directory artifacts/test-results/unit

      - name: Run SQL Server integration tests
        run: >-
          dotnet test tests/HelpDesk.IntegrationTests --configuration Release --no-build --no-restore
          --logger "trx;LogFileName=integration.trx" --results-directory artifacts/test-results/integration

      - name: Reject empty or skipped test runs
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for suite in ("unit", "integration"):
              path = Path(f"artifacts/test-results/{suite}/{suite}.trx")
              counters = ET.parse(path).find(".//{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}Counters")
              assert counters is not None, f"Missing test counters: {path}"
              total = int(counters.attrib["total"])
              assert total > 0, f"No tests ran: {path}"
              assert int(counters.attrib["executed"]) == total, f"Tests skipped: {path}"
              assert int(counters.attrib["passed"]) == total, f"Tests did not all pass: {path}"
              print(f"{suite}: {total} tests passed, none skipped")
          PY

      - name: Show SQL Server logs on failure
        if: failure()
        run: docker logs "${{ job.services.sqlserver.id }}"

      - name: Save test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: backend-test-results
          path: artifacts/test-results/**/*.trx
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/HelpDesk.Web
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/HelpDesk.Web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Type-check and build
        run: npm run build

  images:
    name: Build Docker images
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build API image
        run: docker build --file src/HelpDesk.Api/Dockerfile --tag helpdesk-api:ci .

      - name: Build Web image
        run: docker build --tag helpdesk-web:ci src/HelpDesk.Web

      - name: Verify Web startup with Ubuntu container permissions
        env:
          API_IMAGE: helpdesk-api:ci
          WEB_IMAGE: helpdesk-web:ci
          HELPDESK_SQL_PASSWORD: PublicComposeValidationOnly
          HELPDESK_JWT_KEY: PublicComposeValidationOnlyNotUsedForAuthentication
        run: |
          set -euo pipefail
          compose() { docker compose -p helpdesk-ci-runtime -f compose.ubuntu.yml "$@"; }
          trap 'compose down --volumes' EXIT
          compose run --rm --no-deps -T --entrypoint /bin/sh web -ec '
            printf "127.0.0.1 api\n" >> /etc/hosts
            /docker-entrypoint.sh nginx -g "daemon on;"
            for attempt in 1 2 3 4 5; do
              if wget --quiet --output-document=/dev/null http://127.0.0.1:8080/health; then exit 0; fi
              sleep 1
            done
            exit 1
          '

  publish:
    name: Publish GHCR images
    needs: images
    if: github.repository == 'shunbin2310/HelpDesk-System' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      api_digest: ${{ steps.digests.outputs.api_digest }}
      web_digest: ${{ steps.digests.outputs.web_digest }}
    env:
      API_IMAGE: ghcr.io/shunbin2310/helpdesk-api:${{ github.sha }}
      WEB_IMAGE: ghcr.io/shunbin2310/helpdesk-web:${{ github.sha }}
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Sign in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build versioned API image
        run: >-
          docker build --file src/HelpDesk.Api/Dockerfile --tag "$API_IMAGE"
          --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          --label "org.opencontainers.image.revision=$GITHUB_SHA" .

      - name: Build versioned Web image
        run: >-
          docker build --tag "$WEB_IMAGE"
          --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          --label "org.opencontainers.image.revision=$GITHUB_SHA" src/HelpDesk.Web

      - name: Push API image
        run: docker push "$API_IMAGE"

      - name: Push Web image
        run: docker push "$WEB_IMAGE"

      - name: Read published registry digests
        id: digests
        run: |
          set -euo pipefail
          api_digest=$(docker buildx imagetools inspect "$API_IMAGE" --format '{{json .Manifest}}' | jq -er '.digest')
          web_digest=$(docker buildx imagetools inspect "$WEB_IMAGE" --format '{{json .Manifest}}' | jq -er '.digest')
          [[ "$api_digest" =~ ^sha256:[0-9a-f]{64}$ && "$web_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'api_digest=%s\nweb_digest=%s\n' "$api_digest" "$web_digest" >> "$GITHUB_OUTPUT"

      - name: Record published version
        run: |
          {
            echo '## Published GHCR images'
            printf -- '- API: %s\n' "$API_IMAGE"
            printf -- '- Web: %s\n' "$WEB_IMAGE"
            printf -- '- API digest: %s\n' "$API_DIGEST"
            printf -- '- Web digest: %s\n' "$WEB_DIGEST"
            printf -- '\nSource commit: %s\n' "$GITHUB_SHA"
            echo 'Use this version only after both pushes have succeeded.'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          API_DIGEST: ${{ steps.digests.outputs.api_digest }}
          WEB_DIGEST: ${{ steps.digests.outputs.web_digest }}

      - name: Sign out of GHCR
        if: always()
        run: docker logout ghcr.io

  deploy:
    name: Automatically update Ubuntu
    needs: publish
    if: github.repository == 'shunbin2310/HelpDesk-System' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOCKER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      SERVER_TAILSCALE_IP: ${{ vars.SERVER_TAILSCALE_IP }}
      API_DIGEST: ${{ needs.publish.outputs.api_digest }}
      WEB_DIGEST: ${{ needs.publish.outputs.web_digest }}
    steps:
      - name: Refuse stale commits and missing configuration
        env:
          GH_TOKEN: ${{ github.token }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" == "$GITHUB_SHA" ]]
          [[ "$SERVER_TAILSCALE_IP" =~ ^100\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$API_DIGEST" =~ ^sha256:[0-9a-f]{64}$ && "$WEB_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ -n "$TS_OAUTH_CLIENT_ID" && -n "$TS_AUDIENCE" && -n "$DEPLOY_SSH_PRIVATE_KEY" && -n "$DEPLOY_SSH_KNOWN_HOSTS" ]]

      - name: Connect to the server's Tailscale network
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:helpdesk-deploy
          version: '1.102.5'
          use-cache: 'false'

      - name: Deploy exact digests through pinned SSH
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" == "$GITHUB_SHA" ]]
          umask 077
          SSH_DIR=$(mktemp -d "$RUNNER_TEMP/helpdesk-ssh.XXXXXX")
          trap 'rm -f -- "$SSH_DIR/key" "$SSH_DIR/known_hosts"; rmdir -- "$SSH_DIR"' EXIT
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' > "$SSH_DIR/key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" | tr -d '\r' > "$SSH_DIR/known_hosts"
          unset DEPLOY_SSH_PRIVATE_KEY DEPLOY_SSH_KNOWN_HOSTS
          ssh-keygen -y -P '' -f "$SSH_DIR/key" >/dev/null 2>&1
          ssh-keygen -F "$SERVER_TAILSCALE_IP" -f "$SSH_DIR/known_hosts" >/dev/null
          ssh -F /dev/null -T -i "$SSH_DIR/key" \
            -o IdentitiesOnly=yes -o IdentityAgent=none \
            -o PreferredAuthentications=publickey -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$SSH_DIR/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no \
            -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "helpdesk_deploy@$SERVER_TAILSCALE_IP" \
            "sudo -n /usr/local/sbin/helpdesk-auto-deploy $GITHUB_SHA $API_DIGEST $WEB_DIGEST"
