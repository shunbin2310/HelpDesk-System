name: helpdesk-local

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${HELPDESK_SQL_PASSWORD:?Set HELPDESK_SQL_PASSWORD in .env.docker.local}"
    ports:
      - "127.0.0.1:${HELPDESK_SQL_PORT:-14330}:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - 'SQLCMDPASSWORD="$${MSSQL_SA_PASSWORD}" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -l 5 -Q "SELECT 1" > /dev/null'
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: src/HelpDesk.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=HelpDeskDb;User Id=sa;Password=${HELPDESK_SQL_PASSWORD:?Set HELPDESK_SQL_PASSWORD in .env.docker.local};Encrypt=True;TrustServerCertificate=True"
      Database__ExpectedDatabase: HelpDeskDb
      Jwt__SigningKey: "${HELPDESK_JWT_KEY:?Set HELPDESK_JWT_KEY in .env.docker.local}"
      Attachments__RootPath: /data/attachments
    volumes:
      - attachments:/data/attachments
      - data-protection:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      sqlserver:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: ./src/HelpDesk.Web
    ports:
      - "127.0.0.1:${HELPDESK_WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  sql-data:
  attachments:
  data-protection:
